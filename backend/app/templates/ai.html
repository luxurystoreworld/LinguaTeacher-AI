<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LinguaTeacher AI 2.0</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/css/chat-pro.css">

</head>

<body>

<div id="app">

    <aside class="sidebar">

        <div class="logo">
            🤖 LinguaTeacher
        </div>

        <div class="menu">

            <button id="newChatButton">➕ New Chat</button>

            <button>🇩🇪 German</button>

            <button>🇬🇧 English</button>

            <button id="settingsButton">⚙️ Settings</button>

        </div>

    </aside>

    <main class="main">

        <header class="header">

            <h2>Gemini AI Teacher</h2>

            <div>

                <button class="circle" id="cameraButton">📷</button>

                <button class="circle" id="fileButton">📎</button>

                <button class="circle" id="voiceButton">🎤</button>

            </div>

        </header>

        <section
            class="chat"
            id="chatMessages">

        </section>

        <footer class="bottom">

            <input
                id="userInput"
                type="text"
                placeholder="Ask anything...">

            <button
                class="circle"
                id="sendButton">

                ➤

            </button>

        </footer>

    </main>

</div>

<script src="/static/js/v3/ui.js"></script>
<script src="/static/js/v3/chat.js"></script>
<script src="/static/js/v3/voice.js"></script>
<script src="/static/js/v3/voice-engine.js"></script>
<script src="/static/js/v3/camera.js"></script>
<script src="/static/js/v3/files.js"></script>
<script src="/static/js/v3/settings.js"></script>
<script src="/static/js/v3/app.js"></script>

</body>

</html>
